<style>

.logo{font-size:20px;color:var(--pri);cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent}.gtime{font-weight:800;color:var(--mut);min-width:54px}.gtime.low{color:var(--bad)}.gtbar{flex:1;height:8px;border-radius:99px;background:var(--soft);overflow:hidden}.gtbar i{display:block;height:100%;background:var(--pri);border-radius:99px;transition:width .2s linear}#hx{display:flex;gap:6px}nav{display:flex;gap:4px;flex:1;justify-content:center}

button:active{transform:translateY(3px);box-shadow:none}button.g{background:#fff;color:var(--ink);border:1.5px solid var(--line);box-shadow:none}button.g:active{background:var(--soft)}
button.sm{padding:7px 12px;font-size:14px;border-radius:12px}button.wide{width:100%}button.n{background:var(--bad);box-shadow:0 4px 0 #cc3f50}button.p{background:var(--sun);color:#3b2a00;box-shadow:0 4px 0 #c88a0c}button.m{background:var(--ok);box-shadow:0 4px 0 #148a52}

input,textarea{font:inherit;width:100%;padding:12px 14px;border:2px solid var(--line);border-radius:14px;background:#fff;color:var(--ink)}input:focus,textarea:focus{outline:none;border-color:var(--pri)}
label{display:block;font-weight:800;margin:12px 0 5px}.mut{color:var(--mut);font-size:14px}.tag{font-size:13px;font-weight:800;padding:2px 10px;border-radius:99px;background:var(--soft);color:var(--pri)}.tag.hot{background:#fff1d6;color:#a96a00}
.bar{height:12px;background:var(--line);border-radius:9px;overflow:hidden;margin:6px 0 12px}.bar i{display:block;height:100%;background:var(--ok);border-radius:9px;transition:width .3s}.bar.sm{height:8px;margin:6px 0 4px}

.hi{font:800 24px "Nunito","Noto Sans",sans-serif}.mut2{opacity:.88;font-size:14px;margin-top:4px}.fire{background:rgba(255,255,255,.18);border-radius:20px;padding:10px 16px;text-align:center;display:flex;flex-direction:column;line-height:1.1}.fire span{font-size:26px}.fire b{font-size:30px}.fire small{opacity:.85}
.set{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}.set.due{border-left:6px solid var(--sun)}.empty{text-align:center;color:var(--mut);font-size:30px}.empty p{font-size:15px;margin:6px 0 0}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}.tile{cursor:pointer;background:#fff;border:1px solid var(--line);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:2px;box-shadow:var(--sh)}.tile span{font-size:30px}.tile b{font:800 18px "Nunito","Noto Sans",sans-serif}.tile small{color:var(--mut)}.tile:active{background:var(--soft)}
.fc{text-align:center;padding:30px 16px;min-height:340px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;cursor:pointer;border-radius:28px}
.fc .w{font-size:44px;line-height:1.15;overflow-wrap:anywhere}.ipa{color:var(--mut);font-size:19px;font-family:"Noto Sans","Segoe UI","Lucida Sans Unicode",system-ui,sans-serif;letter-spacing:0}.hint{color:var(--mut);font-size:14px;margin:8px 0 0}
.ans{display:flex;flex-direction:column;align-items:center;gap:8px;margin-top:6px;border-top:2px dashed var(--line);padding-top:16px;width:100%}.vi{font-size:28px;color:var(--pri)}.ex{font-size:17px;max-width:30em;margin:2px 0}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}.three button{display:flex;flex-direction:column;align-items:center;font-size:26px;padding:12px 6px}.three small{font-size:13px}
.nav2{margin-top:6px}.q{text-align:center;padding:26px 18px}.qh{color:var(--mut);font-weight:800;margin-bottom:10px}.q .big{font-size:34px;color:var(--pri)}.sent{font-size:21px;line-height:1.6}.q input{margin:16px 0;text-align:center;font-size:18px}.bigbtn{font-size:30px;padding:14px 26px;border-radius:50%}
.fb{border-radius:16px;padding:12px;margin:0 0 14px;text-align:left}.fb.good{background:#e3f8ed;color:#0f6a40}.fb.miss{background:#ffe9ec;color:#a42a3b}.emo{font-size:52px}
.login{max-width:420px;margin:0 auto;text-align:center}.login .card{text-align:left}.mascot{font-size:64px}.login summary{cursor:pointer;font-weight:800;color:var(--mut)}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}td input{padding:7px}.wrap{overflow-x:auto}

.flip{perspective:1400px;cursor:pointer;margin:4px 0}.flipin{display:grid;transition:transform .55s cubic-bezier(.2,.7,.2,1);transform-style:preserve-3d}.flipin.on{transform:rotateY(180deg)}
.face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:#fff;border:1px solid var(--line);border-radius:28px;box-shadow:var(--sh);padding:22px 16px;min-height:250px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center}
.back{transform:rotateY(180deg);background:#fbfaff}.face .w{font-size:42px;line-height:1.15;overflow-wrap:anywhere}.face .hint{margin:4px 0 0}
.spk{width:46px;height:46px;border-radius:50%;padding:0;font-size:20px;background:#fff;color:var(--ink);border:1.5px solid var(--line);box-shadow:none}.spk:active{background:var(--soft)}
.repchip{display:inline-block;background:#fff1d6;color:#a96a00;font-weight:800;border-radius:99px;padding:3px 12px;margin-bottom:8px;font-size:13px}.three{margin:12px 0 8px}
.sched{display:grid;gap:6px;margin:8px 0;text-align:left}.sched div{display:flex;justify-content:space-between;gap:8px;background:var(--soft);border-radius:12px;padding:8px 12px;font-size:14px}.hero2{background:var(--soft);border-radius:18px;padding:14px;margin:12px 0}.hero2 b{display:block;font-size:22px;color:var(--pri)}
button:disabled{opacity:.5;cursor:default}
.flip.gf{cursor:default}.face.g{min-height:360px;gap:10px}.gq{font:800 26px/1.4 "Nunito","Noto Sans",sans-serif;overflow-wrap:anywhere}.ghint{color:var(--mut);font-size:14px}.gfb{width:100%;max-width:420px;margin:0}.face.g input{max-width:420px;text-align:center;font-size:17px}.face.g .row{justify-content:center}
.micbtn{width:56px;height:56px;padding:0;font-size:24px;border-radius:50%;background:var(--sun);color:#3b2a00;box-shadow:0 4px 0 #c88a0c}.micbtn.on{background:var(--bad);color:#fff;box-shadow:0 4px 0 #cc3f50}
.tm{display:flex;align-items:center;gap:8px;margin:-4px 0 10px}.tm .bar{flex:1;margin:0;height:10px}.tm .bar i{background:var(--sun);transition:width .1s linear}.tm .bar.low i{background:var(--bad)}.tm b{min-width:38px;text-align:right;font-variant-numeric:tabular-nums}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}.opt{background:#fff;color:var(--ink);border:2px solid var(--line);box-shadow:none;text-align:left;padding:14px;font-weight:700}.opt:active{background:var(--soft)}.opt.bad{background:#ffe9ec;border-color:var(--bad);color:#a42a3b}.opt.right{background:#e3f8ed;border-color:var(--ok);color:#0f6a40;opacity:1}
.ordans{min-height:58px;border:2px dashed var(--line);border-radius:16px;padding:8px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;margin:14px 0 10px}.ordpool{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:14px}
.chip{background:#fff;color:var(--ink);border:2px solid var(--line);box-shadow:0 3px 0 var(--line);padding:8px 14px;border-radius:12px}.chip.on{background:var(--soft);border-color:var(--pri);color:var(--pri);box-shadow:0 3px 0 #c9c4ff}
.mcols{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}.mcols>div{display:flex;flex-direction:column;gap:8px}.mc{background:#fff;color:var(--ink);border:2px solid var(--line);box-shadow:none;padding:12px 8px;min-height:56px;font-size:15px}.mc.sel{border-color:var(--pri);background:var(--soft)}.mc.ok{background:#e3f8ed;border-color:var(--ok);color:#0f6a40;opacity:.8}.mc.bad{background:#ffe9ec;border-color:var(--bad)}
@media(max-width:700px){.opts{grid-template-columns:1fr}}
@media(max-width:700px){nav.st{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:6}
nav.st a{flex-direction:column;gap:0;font-size:12px;padding:4px 12px;border-radius:14px}nav.st a i{font-size:22px}#t{bottom:90px}.hero{flex-direction:column;align-items:flex-start}.face .w{font-size:34px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<header><div class="logo" id="logo" role="button" tabindex="0" title="Về trang chủ" onclick="goHome()" onkeydown="if(event.key==='Enter')goHome()">📘 Mr. Duc Tung</div><nav id="nav"></nav><div id="hx"></div></header>
<main id="app"></main><div id="t"></div>
<script>
const K='ielts_v1',TZ='Asia/Ho_Chi_Minh',DAYS=[1,3,7,12,18,24,30],D=864e5,REP={n:3,p:2,m:1};
let db=JSON.parse(localStorage.getItem(K)||'null')||{sets:[],students:{},teacher:null,key:'',me:null,role:null},V={p:'login'};
const $=s=>document.querySelector(s),save=()=>localStorage.setItem(K,JSON.stringify(db)),uid=()=>Math.random().toString(36).slice(2,10);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dk=d=>new Intl.DateTimeFormat('en-CA',{timeZone:TZ}).format(d),fd=t=>t?new Date(t).toLocaleString('vi-VN'):'—';
const S=()=>db.role==='s'?(db.remote||db.sets):db.sets,me=()=>db.students[db.me],P=sid=>me().prog[sid]??={first:Date.now(),pos:0,rev:0,pr:0},W=id=>me().words[id]??={st:'n',seen:0,c:0,w:0};
const setOf=id=>id==='me'?{id:'me',book:'Từ vựng cá nhân',items:me().personal,status:'pub'}:S().find(s=>s.id===id);
const act=s=>s.items.filter(i=>!i.arch),title=s=>s.id==='me'?s.book:`${s.book}${s.test?' – Test '+s.test:''}${s.passage?' – Passage '+s.passage:''}`;
const due=p=>p&&p.init&&p.next&&p.next<=Date.now(),lg=(t,sid,x={})=>me().log.push({t,sid,at:Date.now(),...x});
const skillOf=s=>s.skill==='listening'?'listening':'reading',SKN={reading:'Reading',listening:'Listening'},nsk=k=>S().filter(s=>s.status==='pub'&&skillOf(s)===k).length;
function toast(m){const e=$('#t');e.textContent=m;e.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>e.style.display='none',2800)}
function go(p,x={}){clearInterval(GT);try{V.rec&&V.rec.abort()}catch{}V={p,...x};render();scrollTo(0,0)}
function streakNow(){const m=me();return(m.day===dk(new Date())||m.day===dk(new Date(Date.now()-D)))?m.streak:0}
function bump(){const m=me(),t=dk(new Date());if(m.day===t)return;m.streak=m.day===dk(new Date(Date.now()-D))?m.streak+1:1;m.day=t}
function accent(){db.acc=db.acc==='en-US'?'en-GB':'en-US';save();render();toast('Đã chọn giọng '+(db.acc==='en-US'?'Mỹ':'Anh'))}
function speak(txt,q){if(!('speechSynthesis' in window))return q?0:toast('Trình duyệt không hỗ trợ âm thanh');const L=db.acc||'en-GB',v=speechSynthesis.getVoices().find(v=>v.lang.replace('_','-')===L);
 if(!v)return q?0:toast('Máy chưa có giọng '+(L==='en-GB'?'Anh':'Mỹ')+'. Bấm "Giọng" trên menu để đổi giọng khác.');speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(txt);u.voice=v;u.lang=L;speechSynthesis.speak(u)}
speechSynthesis?.getVoices();
async function freeGen(ws){const out=[];for(const w of ws){let ipa='',pos='',ex='',vi='';
 try{const r=await fetch('https://api.dictionaryapi.dev/api/v2/entries/en/'+encodeURIComponent(w));if(r.ok){const e=(await r.json())[0];ipa=(e.phonetics||[]).map(p=>p.text).find(Boolean)||e.phonetic||'';pos=e.meanings?.[0]?.partOfSpeech||'';ex=(e.meanings||[]).flatMap(m=>m.definitions).map(d=>d.example).find(Boolean)||''}}catch{}
 try{const j=await(await fetch('https://api.mymemory.translated.net/get?q='+encodeURIComponent(w)+'&langpair=en|vi')).json();const t=j.responseData?.translatedText||'';vi=/MYMEMORY|QUERY LENGTH/i.test(t)?'':t}catch{}
 out.push({id:uid(),word:w,ipa,vi,pos,ex})}return out}
const ai=ws=>freeGen(ws);
/* ---------- auth ---------- */
function login(){const n=$('#n').value.trim().replace(/\s+/g,' '),c=$('#c').value.trim().replace(/\s+/g,' ');if(!n||!c)return toast('Nhập đủ tên và lớp');
 const k=(n+'|'+c).toLowerCase();db.students[k]??={name:n,cls:c,first:Date.now(),prog:{},words:{},personal:[],log:[],streak:0,day:null};db.me=k;db.role='s';me().last=Date.now();save();go('menu')}
function out(){db.role=null;db.me=null;save();go('login')}
/* ---------- student ---------- */
function btnFor(s){const p=me().prog[s.id];return !p?`<button onclick="openSet('${s.id}',1)">Start Learning</button>`:!p.init?`<button onclick="openSet('${s.id}',1)">Continue Learning</button>`:due(p)?`<button onclick="startReview('${s.id}')">Review Now</button>`:`<button class="g" onclick="go('set',{sid:'${s.id}'})">Mở bộ từ</button>`}
function openSet(sid){begin(sid,'learn')}
function saveHard(s,p){act(s).forEach(i=>{W(i.id).hd=p.ses.hard[i.id]||''})}
function begin(sid,mode){const s=setOf(sid),p=P(sid),L=act(s),t=dk(new Date()),n=p.rev+1;let z=p.ses;
 if(!z||z.k!==mode||z.d!==t||(mode==='review'&&z.n!==n)){
  const hr={n:0,p:1};let order=L.map(x=>x.id);
  if(mode==='review')order=[...L].sort((a,b)=>(hr[W(a.id).hd]??2)-(hr[W(b.id).hd]??2)).map(x=>x.id);
  z=p.ses={k:mode,d:t,n,ok:[],hard:{},order};
  if(mode==='learn'&&!p.init)L.forEach(x=>{const w=W(x.id);w.st='n';w.seen=0;w.hd=''})}
 const q=z.order.filter(id=>!z.ok.includes(id)&&L.some(x=>x.id===id));
 V={p:'fc',sid,mode,q,pend:[],show:null,hist:[],total:L.length,rep:0,flip:0,rv:0};scrollTo(0,0);advance()}
function home(){const m=me(),dl=S().filter(s=>s.status==='pub'&&due(m.prog[s.id])).sort((a,b)=>m.prog[a.id].next-m.prog[b.id].next),st=streakNow(),h=new Date().getHours();
 return`<div class="hero"><div><div class="hi">${h<12?'Chào buổi sáng':h<18?'Chào buổi chiều':'Chào buổi tối'}, ${esc(m.name.split(' ')[0])}!</div><div class="mut2">${st?'Giữ lửa nhé, hôm nay học thêm một chút!':'Hoàn thành 1 lượt Flashcards, Review hoặc Practice để bắt đầu chuỗi ngày học.'}</div></div><div class="fire"><span>🔥</span><b>${st}</b><small>ngày</small></div></div>
 <h2>Review Today</h2>${dl.length?dl.map(s=>`<div class="card set due"><div><b>${esc(s.book)}</b><div class="mut">${SKN[skillOf(s)]}${title(s).slice(s.book.length+3)?' · '+esc(title(s).slice(s.book.length+3)):''}</div></div><button onclick="startReview('${s.id}')">Review Now</button></div>`).join(''):'<div class="card empty">🎉<p>Hôm nay không có bộ từ nào đến hạn ôn.<br>Vào thư viện để học hoặc luyện thêm nhé.</p></div>'}
 ${pdueCard()}<h2>Vocabulary Library</h2><div class="tiles"><a class="tile" onclick="go('lib',{sk:'reading'})"><span>📖</span><b>Reading</b><small>${nsk('reading')} bộ từ Cambridge</small></a><a class="tile" onclick="go('lib',{sk:'listening'})"><span>🎧</span><b>Listening</b><small>${nsk('listening')} bộ từ Cambridge</small></a><a class="tile" style="grid-column:1/-1" onclick="go('mine')"><span>⭐</span><b>My Vocabulary</b><small>${m.personal.filter(i=>!i.arch).length} từ</small></a></div>`}
function lib(){const sk=V.sk||'reading',ss=S().filter(s=>s.status==='pub'&&skillOf(s)===sk),bk=[...new Set(ss.map(s=>s.book))],m=me();
 return`<h1>Cambridge ${SKN[sk]}</h1><div class="row" style="justify-content:flex-start;margin-bottom:6px"><button class="${sk==='reading'?'':'g'} sm" onclick="go('lib',{sk:'reading'})">📖 Reading</button><button class="${sk==='listening'?'':'g'} sm" onclick="go('lib',{sk:'listening'})">🎧 Listening</button><button class="g sm" onclick="go('home')">← Vocabulary</button></div>`+(bk.length?bk.map(b=>`<h2>${esc(b)}</h2>`+ss.filter(s=>s.book===b).map(s=>{const L=act(s),k=L.filter(i=>m.words[i.id]?.st==='m').length,p=m.prog[s.id],chip=!p?'Chưa học':!p.init?'Đang học':due(p)?'Đến hạn ôn':'Đã học xong';
 return`<div class="card set"><div style="flex:1;min-width:150px"><b>${esc(title(s).slice(b.length+3)||'Bộ từ')}</b> <span class="tag ${due(p)?'hot':''}">${chip}</span><div class="bar sm"><i style="width:${L.length?k/L.length*100:0}%"></i></div><div class="mut">${k}/${L.length} từ đã thuộc</div></div>${btnFor(s)}</div>`}).join('')).join(''):'<div class="card empty">📭<p>Mr. T chưa đăng bộ từ '+SKN[sk]+' nào.</p></div>')}
function setPage(){const s=setOf(V.sid),p=P(s.id);return`<h1>${esc(title(s))}${s.id==='me'?'':` <span class="tag">${SKN[skillOf(s)]}</span>`}</h1><div class="card"><p class="mut">${act(s).length} từ · ${p.init?'Đã học xong lần đầu · Review '+p.rev+' · Lần ôn tới: '+fd(p.next):'Đang học lần đầu'}</p>
 <div class="row" style="justify-content:flex-start"><button onclick="openSet('${s.id}')">Flashcards</button>${due(p)?`<button onclick="startReview('${s.id}')">Review Now</button>`:''}<button class="p" onclick="startPractice('${s.id}')">Practice</button></div></div>`}
const PD=[1,3,7,12,18,24,30],gap=n=>n<=1?1:n<=7?PD[n-1]-PD[n-2]:30;

function mkQ(it,t,L){const q={it,t};
 if(t==='mcq'){q.ans=it.vi;const o=new Set([q.ans]);shuf(L.filter(x=>x.id!==it.id)).forEach(x=>{if(o.size<4&&x.vi&&!o.has(x.vi))o.add(x.vi)});q.opts=shuf([...o]);return q}
 const sw=new Set([it.word.toLowerCase()]),sv=new Set([it.vi.toLowerCase()]),ps=[it];
 for(const x of shuf(L.filter(x=>x.id!==it.id))){if(ps.length>=5)break;const w=x.word.toLowerCase(),v=(x.vi||'').toLowerCase();if(!v||sw.has(w)||sv.has(v))continue;sw.add(w);sv.add(v);ps.push(x)}
 if(ps.length<2)return mkQ(it,'mcq',L);
 q.pairs=shuf(ps);q.right=shuf(ps);for(let k=0;k<5&&q.right.every((x,i)=>x.id===q.pairs[i].id);k++)q.right=shuf(ps);
 return q}
function startPractice(sid){const L=pitems(sid);if(L.length<2)return toast('Cần ít nhất 2 từ để luyện tập');

 while(qs.length<n&&pool.length){let r=Math.random()*pool.reduce((a,i)=>a+wt(i),0),k=0;for(;k<pool.length-1&&(r-=wt(pool[k]))>0;k++);const it=pool.splice(k,1)[0];
  qs.push(mkQ(it,L.length>=3&&qs.length%2===1?'match':'mcq',L))}

 if(!S1.done&&!S1.dl)S1.dl=Date.now()+TLIM;const r=Math.max(0,(S1.dl||0)-Date.now());let body;
 if(q.t==='mcq')body=`<div class="qh">Chọn nghĩa đúng của từ</div><div class="big">${esc(it.word)}</div>${it.ipa?`<div class="ipa">${esc(it.ipa)}</div>`:''}<button class="g spk" aria-label="Nghe" onclick="speak('${sp}')">🔊</button><div class="opts">${q.opts.map((o,k)=>`<button class="opt ${S1.bad.includes(k)?'bad':''} ${S1.done&&o===q.ans?'right':''}" ${S1.done||S1.bad.includes(k)?'disabled':''} onclick="pickO(${k})">${esc(o)}</button>`).join('')}</div>`;

 const foot=S1.done?`<div class="row" style="justify-content:center">${V.i>0?`<button class="g" onclick="prGo(-1)">← Câu trước</button>`:''}<button onclick="prGo(1)">${V.i+1>=V.qs.length?'Xem kết quả':'Câu tiếp theo →'}</button></div>`

  const m={'not-allowed':'Hãy cho phép trang dùng micro rồi thử lại','service-not-allowed':'Hãy cho phép trang dùng micro rồi thử lại','no-speech':'Không nghe thấy gì, thử lại nhé','audio-capture':'Không tìm thấy micro'}[e.error];toast(m||'Lỗi micro: '+e.error)};
 r.onend=()=>{if(V.rec===r){V.rec=null;V.listening=0;if(V.micMsg&&V.p==='gq'&&!$('#gmicmsg'))render();else gMicUi();if(!got&&!err&&V.p==='gq'&&!V.done)toast('Không nghe thấy gì, thử lại nhé')}};
 try{r.start()}catch{V.rec=null;V.listening=0;gMicUi()}}
/* ---------- sets.json ---------- */
async function pull(){try{const r=await fetch('sets.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)return;const j=await r.json();if(!Array.isArray(j))return;db.remote=j;save();if(['home','lib','set'].includes(V.p))render()}catch{}}
/* ---------- shell ---------- */
function render(){const s=db.role==='s',on=(...p)=>p.includes(V.p)?'on':'',nav=$('#nav');nav.className=s?'st':'';
 nav.innerHTML=s?`<a class="${on('home','lib','mine','set','fc','pr','done','pcr')}" onclick="go('home')"><i>📖</i>Vocabulary</a><a class="${on('gram','gq','gdone')}" onclick="go('gram')"><i>✏️</i>Grammar</a>`:'';
 $('#hx').innerHTML=db.role?`<button class="g sm" onclick="accent()">🔊 ${db.acc==='en-US'?'Mỹ':'Anh'}</button><button class="g sm" onclick="out()">Thoát</button>`:'';
 const guard=(r,f)=>db.role===r?f():loginView();
 const v={login:loginView,menu:()=>guard('s',menu),gram:()=>guard('s',gram),gq:()=>guard('s',gq),gdone:()=>guard('s',gdone),home:()=>guard('s',home),lib:()=>guard('s',lib),set:()=>guard('s',setPage),mine:()=>guard('s',mine),fc:()=>guard('s',fc),done:()=>guard('s',doneView),pr:()=>guard('s',pr),pcr:()=>guard('s',pcr)}[V.p];
 $('#app').innerHTML=v();const a=$('#ans');if(a&&!a.disabled)a.focus()}
function loginView(){return`<div class="login"><div class="mascot">📘</div><h1>Mr. Duc Tung</h1><p class="mut">Học từ vựng và ngữ pháp mỗi ngày: flashcard, luyện nói và lịch ôn thông minh giúp bạn nhớ lâu hơn.</p>
 <div class="card"><label>Tên tiếng Anh đầy đủ</label><input id="n" placeholder="Alex Nguyen" autocomplete="off"><label>Lớp</label><input id="c" placeholder="Foundation 01" onkeydown="if(event.key==='Enter')login()"><p><button class="wide" onclick="login()">Start Learning</button></p></div>
 </div>`}
document.addEventListener('keydown',e=>{if(/INPUT|TEXTAREA/.test(e.target.tagName))return;
 if(V.p==='fc'){if(e.key===' '||e.key==='Enter'){e.preventDefault();flipCard()}else if(V.rv&&'123'.includes(e.key)&&e.key)mark('npm'[e.key-1]);else if(e.key==='ArrowRight')step(1);else if(e.key==='ArrowLeft')step(-1)}
 else if(V.p==='pr'){const q=V.qs[V.i],z=V.st[V.i];if(z?.done&&e.key==='Enter'){e.preventDefault();prGo(1)}else if(q&&q.t==='mcq'&&z&&!z.done&&/^[1-4]$/.test(e.key))pickO(e.key-1)}
 else if(V.p==='gq'&&V.done&&(e.key==='Enter'||e.key===' ')){e.preventDefault();gNext()}});
if(db.role!=='s'||!me())db.role=null;V.p=db.role==='s'?'menu':'login';render();pull();document.addEventListener('visibilitychange',()=>{if(!document.hidden)pull()});
</script></body></html>
